# Incoming traffic rules for the namespace. Pods accept nothing unless a rule below allows it.
# Outgoing traffic is not restricted. Rollback: kubectl delete -f this file.

# 1. Default: no pod in this namespace accepts incoming connections
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: notification
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# 2. App pods: HTTP from Traefik (users) and from the monitoring namespace (Blackbox checks)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-allow-http
  namespace: notification
spec:
  podSelector:
    matchLabels: { app: notification }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: 80 }
---
# 3. Postgres: only the app, the exporter, and jobs labelled db-client (migrations, backups)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-clients
  namespace: notification
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: notification } }
        - podSelector: { matchLabels: { app: postgres-exporter } }
        - podSelector: { matchLabels: { db-client: "true" } }
      ports:
        - { protocol: TCP, port: 5432 }
---
# 4. Exporter: metrics scrape from Prometheus in the monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exporter-allow-prometheus
  namespace: notification
spec:
  podSelector:
    matchLabels: { app: postgres-exporter }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: 9187 }
