# Runs database migrations once, before the app is rolled out.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: notification
spec:
  backoffLimit: 6            # retries cover the time Postgres needs to start
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        appArmorProfile:             # see 20-postgres.yaml; needs the profile loaded on the node
          type: Localhost
          localhostProfile: fable-c1-container
      nodeSelector:
        kubernetes.io/hostname: w1
      containers:
        - name: migrate
          image: 172.31.34.196:5050/root/notification-service/app:8b4a462b
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
