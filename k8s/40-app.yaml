# nginx and PHP-FPM run in one pod and talk over localhost:9000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: notification
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below 2 ready pods
  template:
    metadata:
      labels:
        app: notification
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        appArmorProfile:             # see 20-postgres.yaml; needs the profile loaded on the node
          type: Localhost
          localhostProfile: fable-c1-container
      nodeSelector:
        kubernetes.io/hostname: w1
      containers:
        - name: app
          image: 172.31.34.196:5050/root/notification-service/app:8b4a462b
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          lifecycle:
            preStop:
              sleep: { seconds: 15 }    # PHP-FPM outlives nginx during shutdown
          readinessProbe:
            tcpSocket: { port: 9000 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: web
          image: 172.31.34.196:5050/root/notification-service/web:8b4a462b
          ports:
            - containerPort: 80
          env:
            - name: PHP_FPM_HOST
              value: "127.0.0.1"
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          lifecycle:
            preStop:
              sleep: { seconds: 10 }    # keep serving until Traefik has dropped this pod from its list
          readinessProbe:
            httpGet: { path: /api/health, port: 80 }   # goes through PHP-FPM and Laravel
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /robots.txt, port: 80 }   # nginx only: a slow app must not restart nginx
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: notification
spec:
  selector:
    app: notification
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notification
  namespace: notification
spec:
  ingressClassName: traefik
  rules:
    - host: notification.localhost     # browsers resolve *.localhost to 127.0.0.1; reach it through an SSH tunnel
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notification
                port:
                  number: 80
