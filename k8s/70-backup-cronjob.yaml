# pg_dump of the project database every 6 hours, newest 8 kept.
# The dumps sit on the same node as the database: this protects against a bad deploy or a wrong DELETE,
# not against losing the node. Copy a dump off the node for that.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: notification
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: notification
spec:
  schedule: "15 */6 * * *"          # 00:15, 06:15, 12:15, 18:15 UTC
  startingDeadlineSeconds: 3600     # a run missed while the cluster was off is skipped after 1 hour
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            db-client: "true"
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: w1
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            appArmorProfile:
              type: Localhost
              localhostProfile: fable-c1-container
          containers:
            - name: pg-dump
              image: postgres:16
              env:
                - name: PGHOST
                  value: postgres
                - name: PGDATABASE
                  valueFrom: { configMapKeyRef: { name: app-config, key: DB_DATABASE } }
                - name: PGUSER
                  valueFrom: { configMapKeyRef: { name: app-config, key: DB_USERNAME } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } }
              command:
                - sh
                - -c
                - |
                  set -e
                  f=/backups/$PGDATABASE-$(date -u +%Y%m%d-%H%M).dump
                  pg_dump -Fc -f "$f.tmp" && mv "$f.tmp" "$f"
                  pg_restore -l "$f" > /dev/null          # the dump must at least be readable
                  ls -1t /backups/*.dump | tail -n +9 | xargs -r rm --
                  echo "backup written:"; ls -la /backups
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { cpu: 300m, memory: 128Mi }
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
