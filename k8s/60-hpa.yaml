# Adds app pods when average CPU passes 70% of what the pods request (120m per pod), removes them when it drops.
# Needs metrics-server (ships with k3s). All pods stay on the app node, so max is kept small.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
  namespace: notification
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
