
services:
  app:
    image: notification-service:${CI_COMMIT_SHORT_SHA:-latest}
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - laravel_storage:/var/www/html/storage
    env_file:
      - .env.production

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  laravel_storage:
