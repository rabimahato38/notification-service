# Test stack. The pipeline sets APP_IMAGE, WEB_IMAGE, BIND_ADDR, APP_KEY and DB_PASSWORD.
# Locally: docker compose up -d --build   (builds both images from the Dockerfile)
services:
  app:
    image: ${APP_IMAGE:-notification-service/app:local}
    build:
      context: .
      target: app
    restart: unless-stopped
    mem_limit: 384m
    volumes:
      - laravel_storage:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY must be set in the deployment environment}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laravel_db}
      DB_USERNAME: ${DB_USERNAME:-laravel_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the deployment environment}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: ${WEB_IMAGE:-notification-service/web:local}
    build:
      context: .
      target: web
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:80"
    healthcheck:
      # goes nginx -> php-fpm -> Laravel, so "healthy" means the whole chain answers
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - app

  db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_db}
      POSTGRES_USER: ${DB_USERNAME:-laravel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  laravel_storage:
