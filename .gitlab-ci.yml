# Pipeline: validate -> test -> build -> deploy (Compose on the Docker host) -> release (k3s via ArgoCD)
# Runs on the project runner (Docker executor): every job is a fresh container.

stages: [validate, test, build, deploy, release]

variables:
  # The same tag is built, pushed, deployed and rolled back to
  APP_IMAGE: $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA
  TEST_HOST: 172.31.34.196            # private IP of the Docker host
  DEPLOY_REPO: root/notification-deploy

default:
  tags: [docker]

validate:
  stage: validate
  image: composer:2
  script:
    - composer validate --no-check-publish

test:
  stage: test
  image: composer:2
  variables:
    APP_ENV: testing
    APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="   # dummy key, tests only
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  cache:
    key: { files: [composer.lock] }
    paths: [vendor/]
  script:
    - composer install --no-interaction --no-progress
    - cp .env.example .env
    - php artisan test

build:
  stage: build
  image: docker:29-cli
  script:
    # CI_REGISTRY_USER/PASSWORD are created by GitLab for this job only
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull --target app -t "$APP_IMAGE" .
    - docker build --target web -t "$WEB_IMAGE" .
    - docker push "$APP_IMAGE"
    - docker push "$WEB_IMAGE"

deploy_test:
  stage: deploy
  image: docker:29-cli
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: test
    url: http://$TEST_HOST:8081
  resource_group: test                # one deployment at a time
  variables:
    COMPOSE_PROJECT_NAME: notification-service
    BIND_ADDR: $TEST_HOST
  script:
    # TEST_APP_KEY / TEST_DB_PASSWORD: masked CI/CD variables, scope "test"
    - export APP_KEY="$TEST_APP_KEY" DB_PASSWORD="$TEST_DB_PASSWORD"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker compose pull app nginx
    - docker compose up -d --no-build --wait --wait-timeout 180
    - docker compose exec -T app php artisan migrate --force
    - wget -q -O - "http://$TEST_HOST:8081/api/health"

release_k3s:
  stage: release
  image: alpine/k8s:1.36.6           # has git and kustomize
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: k3s
  resource_group: k3s
  script:
    # This job never touches the cluster: it commits the new tag, ArgoCD applies it.
    # DEPLOY_REPO_TOKEN may only write to the deploy repo.
    - git clone -q "$CI_SERVER_PROTOCOL://ci-push:$DEPLOY_REPO_TOKEN@$CI_SERVER_HOST:$CI_SERVER_PORT/$DEPLOY_REPO.git" deploy
    - cd deploy
    - kustomize edit set image "$APP_IMAGE" "$WEB_IMAGE"
    - git -c user.name="GitLab CI" -c user.email="ci@gitlab.lab" commit -am "Release $CI_COMMIT_SHORT_SHA" -m "$CI_COMMIT_TITLE" || echo "already on this tag"
    - git push origin HEAD:main
