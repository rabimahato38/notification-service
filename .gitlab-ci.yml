# Runs on the project runner on w2 (Docker executor): every job is a throwaway container.
stages:
  - validate
  - test
  - build

variables:
  GIT_DEPTH: "20"

default:
  tags:
    - docker

validate:
  stage: validate
  image: composer:2
  script:
    - composer validate --no-check-publish

test:
  stage: test
  image: composer:2
  variables:
    APP_ENV: testing
    # throwaway key for tests only, never used by a deployment
    APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/
  script:
    - composer install --no-interaction --prefer-dist --no-progress
    # Laravel expects a .env file; job variables above still win over its values
    - cp .env.example .env
    - php artisan test

build:
  stage: build
  image: docker:29-cli
  script:
    # CI_REGISTRY_* are short-lived credentials GitLab creates for this job only
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  after_script:
    - docker logout "$CI_REGISTRY"

# deploy_test (Compose on w2) returns in Phase 3.
