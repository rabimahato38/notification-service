stages:
  - validate
  - test
  - build
  - deploy_test

variables:
  GIT_DEPTH: "20"

# This project uses a project-scoped shell runner on the GitLab VM. The second
# tag keeps these jobs off the existing Docker-executor runner.
default:
  tags:
    - dev
    - notification-shell

validate:
  stage: validate
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/app" -w /app composer:2 composer validate --no-check-publish

test:
  stage: test
  script:
    - >-
      docker run --rm --user "$(id -u):$(id -g)"
      -e APP_ENV=testing
      -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      -e DB_CONNECTION=sqlite
      -e DB_DATABASE=:memory:
      -v "$CI_PROJECT_DIR:/app"
      -w /app
      composer:2
      sh -lc 'composer install --no-interaction --prefer-dist --no-progress && php artisan test'

build:
  stage: build
  script:
    - docker build --pull -t "notification-service:${CI_COMMIT_SHORT_SHA}" .

deploy_test:
  stage: deploy_test
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -r /etc/notification-service/test.env
    - docker compose --env-file /etc/notification-service/test.env -f docker-compose.yml -p notification-service up -d --no-build --remove-orphans
    - docker compose --env-file /etc/notification-service/test.env -f docker-compose.yml -p notification-service exec -T app php artisan migrate --force
    - >-
      for attempt in $(seq 1 30); do
        if curl --fail --silent --show-error http://127.0.0.1:8081/api/health; then
          exit 0;
        fi;
        sleep 3;
      done;
      docker compose --env-file /etc/notification-service/test.env -f docker-compose.yml -p notification-service ps;
      exit 1
