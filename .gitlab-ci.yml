# Runs on the project runner on w2 (Docker executor): every job is a throwaway container.
stages:
  - validate
  - test
  - build
  - deploy
  - deploy_k3s

variables:
  GIT_DEPTH: "20"
  # One tag per commit: the same tag is built, pushed, deployed and rolled back to
  APP_IMAGE: $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA

default:
  tags:
    - docker

# CI_REGISTRY_* are short-lived credentials GitLab creates for each job
.registry_login: &registry_login
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

validate:
  stage: validate
  image: composer:2
  script:
    - composer validate --no-check-publish

test:
  stage: test
  image: composer:2
  variables:
    APP_ENV: testing
    # throwaway key for tests only, never used by a deployment
    APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/
  script:
    - composer install --no-interaction --prefer-dist --no-progress
    # Laravel expects a .env file; job variables above still win over its values
    - cp .env.example .env
    - php artisan test

build:
  stage: build
  image: docker:29-cli
  script:
    - *registry_login
    - docker build --pull --target app -t "$APP_IMAGE" .
    - docker build --target web -t "$WEB_IMAGE" .
    - docker push "$APP_IMAGE"
    - docker push "$WEB_IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        for name in app web; do
          docker tag "$CI_REGISTRY_IMAGE/$name:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/$name:latest"
          docker push "$CI_REGISTRY_IMAGE/$name:latest"
        done
      fi
  after_script:
    - docker logout "$CI_REGISTRY"

# Compose deployment on w2. Rollback: GitLab > Operate > Environments > test > re-deploy an older entry.
deploy_test:
  stage: deploy
  image: docker:29-cli
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: test
    url: http://172.31.34.196:8081
  resource_group: test        # never two deployments at the same time
  variables:
    COMPOSE_PROJECT_NAME: notification-service
    BIND_ADDR: 172.31.34.196  # private IP only
  script:
    # TEST_* are masked, protected variables scoped to the "test" environment
    - export APP_KEY="$TEST_APP_KEY" DB_PASSWORD="$TEST_DB_PASSWORD"
    - *registry_login
    - docker compose pull app nginx
    - docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180
    - docker compose exec -T app php artisan migrate --force
    - wget -q -O - "http://$BIND_ADDR:8081/api/health"
    - docker compose ps
  after_script:
    - export APP_KEY=unused DB_PASSWORD=unused
    - if [ "$CI_JOB_STATUS" != "success" ]; then docker compose ps -a; docker compose logs --tail 40; fi
    - docker logout "$CI_REGISTRY"

# Kubernetes deployment (namespace "notification"). Runs after the Compose test deployment succeeded.
# K3S_TOKEN belongs to the service account ci-deployer, which can only touch this namespace.
deploy_k3s:
  stage: deploy_k3s
  image: alpine/k8s:1.36.6
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: k3s
    url: http://notification.localhost:8080
  resource_group: k3s
  variables:
    K3S_SERVER: https://172.31.11.8:6443
    KUBECONFIG: /tmp/kubeconfig
    NS: notification
  script:
    - echo "$K3S_CA_B64" | base64 -d > /tmp/ca.crt
    - kubectl config set-cluster k3s --server="$K3S_SERVER" --certificate-authority=/tmp/ca.crt --embed-certs=true
    - kubectl config set-credentials ci-deployer --token="$K3S_TOKEN"
    - kubectl config set-context k3s --cluster=k3s --user=ci-deployer --namespace="$NS"
    - kubectl config use-context k3s
    # 1. migrations with the new image, as a fresh Job
    - kubectl delete job migrate --ignore-not-found --wait=true
    - sed "s#/app:[0-9a-f]*\$#/app:$CI_COMMIT_SHORT_SHA#" k8s/30-migrate-job.yaml | kubectl create -f -
    - kubectl wait --for=condition=complete job/migrate --timeout=180s
    - kubectl logs job/migrate --tail=5
    # 2. rolling update; roll back by itself if the new pods do not become ready
    - kubectl set image deployment/app app="$APP_IMAGE" web="$WEB_IMAGE"
    - kubectl rollout status deployment/app --timeout=180s || (kubectl rollout undo deployment/app && exit 1)
    # 3. check through the Ingress
    - wget -q -O - --header "Host:notification.localhost" http://172.31.11.8/api/health
    - kubectl get pods -o wide
